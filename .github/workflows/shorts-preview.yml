name: SW75 Shorts preview

on:
  push:
    branches-ignore: [main]
    paths:
      - '.github/workflows/shorts-preview.yml'
      - '.github/workflows/shorts-delivery.yml'
      - 'shorts/**'
      - 'tests/test_shorts.py'
  workflow_run:
    workflows: ["Утренний морской обзор"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      day:
        description: "Дата архивного выпуска (YYYY-MM-DD, МСК)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sw75-shorts-preview
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test and prepare
        env:
          EDITION_INPUT: ${{ inputs.day }}
          BUILD_STARTED: ${{ github.event.workflow_run.run_started_at }}
          VIDEO_RENDER_ENABLED: ${{ vars.VIDEO_RENDER_ENABLED || 'false' }}
        run: |
          python -m unittest discover -s tests
          day="$EDITION_INPUT"
          if [[ -n "$BUILD_STARTED" ]]; then
            day="$(TZ=Europe/Moscow date -d "$BUILD_STARTED" +%F)"
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            latest="$(find shorts/editions -maxdepth 1 -name '*.json' | sort | tail -n 1)"
            day="$(basename "$latest" .json)"
          fi
          [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          python shorts/pipeline.py "$day"
          if [[ -d "shorts-output/$day-metadata" && "$VIDEO_RENDER_ENABLED" == true ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
            python -m pip install -r shorts/requirements-render.txt
            python shorts/fetch_model.py .shorts-models
            python shorts/pipeline.py "$day" --render --model-dir .shorts-models
          fi
          echo "EDITION_DAY=$day" >> "$GITHUB_ENV"
          if [[ -d "shorts-output/$day" ]]; then
            echo "PACKAGE=shorts-output/$day" >> "$GITHUB_ENV"
            echo "### Проверка MP4" >> "$GITHUB_STEP_SUMMARY"
            cat "shorts-output/$day/qa.json" >> "$GITHUB_STEP_SUMMARY"
          elif [[ -d "shorts-output/$day-metadata" ]]; then
            echo "PACKAGE=shorts-output/$day-metadata" >> "$GITHUB_ENV"
            echo "Готовы метаданные выпуска $day." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "На $day подтверждённого выпуска нет." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event.repository.private == true && env.PACKAGE != ''
        with:
          name: sw75-${{ env.EDITION_DAY }}
          path: ${{ env.PACKAGE }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
